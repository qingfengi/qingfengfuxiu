<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中国科技公司2023年营收对比</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
      letter-spacing: 0.04em;
    }
    p.subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 32px;
    }
    .chart-wrapper {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 32px;
      width: 100%;
      max-width: 780px;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <h1>中国科技公司2023年营收对比</h1>
  <p class="subtitle">数据来源：各公司年报（单位：亿元人民币）</p>
  <div class="chart-wrapper">
    <canvas id="revenueChart"></canvas>
  </div>

  <script>
    Chart.register(ChartDataLabels);

    const companies = ['字节跳动', '阿里巴巴', '华为', '腾讯', '小米'];
    const revenues  = [11000, 9411, 7042, 6601, 3289];
    const colors = [
      { bg: 'rgba(99,  102, 241, 0.85)', border: '#6366f1' },
      { bg: 'rgba(249, 115,  22, 0.85)', border: '#f97316' },
      { bg: 'rgba( 20, 184, 166, 0.85)', border: '#14b8a6' },
      { bg: 'rgba( 59, 130, 246, 0.85)', border: '#3b82f6' },
      { bg: 'rgba(236,  72, 153, 0.85)', border: '#ec4899' },
    ];

    new Chart(document.getElementById('revenueChart'), {
      type: 'bar',
      data: {
        labels: companies,
        datasets: [{
          label: '营收（亿元）',
          data: revenues,
          backgroundColor: colors.map(c => c.bg),
          borderColor:      colors.map(c => c.border),
          borderWidth: 2,
          borderRadius: 8,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true,
        animation: { duration: 900, easing: 'easeOutQuart' },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ` ${ctx.parsed.y.toLocaleString()} 亿元`
            }
          },
          datalabels: {
            anchor: 'end',
            align: 'top',
            color: '#374151',
            font: { size: 13, weight: '600' },
            formatter: v => v.toLocaleString()
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { font: { size: 14 }, color: '#374151' }
          },
          y: {
            beginAtZero: true,
            max: 12500,
            grid: { color: 'rgba(0,0,0,0.06)' },
            ticks: {
              font: { size: 12 },
              color: '#9ca3af',
              callback: v => v.toLocaleString()
            },
            title: {
              display: true,
              text: '营收（亿元人民币）',
              color: '#6b7280',
              font: { size: 12 }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
